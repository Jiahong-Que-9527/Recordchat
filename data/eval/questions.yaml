# RecordChat authored eval set (AUD-01 / SPEC Phase 9).
# This file is project-owned content and MUST stay versioned under data/eval/.
#
# Fields consumed by scripts/evaluate_rag.py:
#   id, question, expected_query_type, expected_keywords, expects_jsonld
# Gold retrieval fields (#28):
#   expected_entities          — entity names that should appear in top-k metadata
#   expected_source_families   — substrings matched against source_name (any hit = family hit)
#   expected_canonical_version — if set, at least one top-k hit should carry this version

